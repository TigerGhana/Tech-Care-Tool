function csv(name,rows){if(!rows.length)return toast('Nothing to export');const k=Object.keys(rows[0]);
 const t=[k.join(','),...rows.map(r=>k.map(c=>'"'+String(r[c]==null?'':r[c]).replace(/"/g,'""')+'"').join(','))].join('\n');

 try{await fn(e.target.elements)}finally{busy=false;if(b){b.disabled=false;b.textContent=t}}}
/* ---------- AUTH ---------- */
function authView(m,signup){
 $('#root').innerHTML=`<div class="auth"><div class="card"><h2 style="margin-top:0;color:var(--pr)">TECH-CARE OUTREACH TOOL</h2>
 <form id="af" onsubmit="${signup?'doSignup':'doLogin'}(event)">
 ${signup?'<label>Full Name<input name="fname" required></label><label>Email<input name="email" type="email" required></label>':''}
 <label>Telephone (10 digits)<input name="phone" inputmode="numeric" maxlength="10" pattern="[0-9]{10}" required oninput="this.value=this.value.replace(/\\D/g,'').slice(0,10)"></label>
 <label>Password<input name="password" type="password" minlength="6" required></label>
 ${signup?'<label>Confirm Password<input name="confirm" type="password" minlength="6" required></label>':''}
 <div class="err" id="am">${esc(m||'')}</div><button style="width:100%">${signup?'Create account':'Sign in'}</button></form>
 <p style="text-align:center"><a href="#" onclick="authView('',${!signup});return false" style="color:var(--pr)">${signup?'Already have an account? Sign in':'First time? Create an account'}</a></p>
 ${signup?'<small style="color:var(--mu)">New accounts start as Viewer until a BME Executive assigns a role.</small>':''}</div></div>`}
const amsg=m=>{const e=$('#am');if(e)e.textContent=m};
async function doLogin(e){e.preventDefault();const f=e.target.elements;amsg('');
 const r=await sb.auth.signInWithPassword({email:mail(f.phone.value),password:f.password.value});
 if(r.error)return amsg('Invalid telephone number or password');await start()}
async function doSignup(e){e.preventDefault();const f=e.target.elements,phone=f.phone.value;
 if(!/^\d{10}$/.test(phone))return amsg('Telephone must be exactly 10 digits');
 if(f.password.value!==f.confirm.value)return amsg('Passwords do not match');
 const r=await sb.auth.signUp({email:mail(phone),password:f.password.value,options:{data:{full_name:f.fname.value.trim(),email:f.email.value.trim(),phone}}});
 if(r.error)return amsg(r.error.message.includes('registered')?'This telephone number is already registered':r.error.message);
 if(r.data.session)await start();else authView('Account created. Please sign in.')}
async function init(){
 if(!SUPABASE_URL||!SUPABASE_ANON_KEY){$('#root').innerHTML='<div class="auth"><div class="card"><h3>Setup needed</h3><p>Open <b>index.html</b> and fill in <code>SUPABASE_URL</code> and <code>SUPABASE_ANON_KEY</code> at the top of the script.</p></div></div>';return}
 sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
 sb.auth.onAuthStateChange(ev=>{if(ev==='SIGNED_OUT'){me=null;authView()}});
 const s=(await sb.auth.getSession()).data.session;s?await start():authView()}
async function start(){
 const u=(await sb.auth.getUser()).data.user;let p=null;
 for(let i=0;i<4&&!p;i++){p=(await sb.from('profiles').select('*').eq('id',u.id).maybeSingle()).data;if(!p)await new Promise(r=>setTimeout(r,600))}
 if(!p){const m=u.user_metadata||{},ins=await sb.from('profiles').insert({id:u.id,full_name:m.full_name||null,email:m.email||null,phone:m.phone||(u.email||'').split('@')[0]});
  if(!ins.error)p=(await sb.from('profiles').select('*').eq('id',u.id).maybeSingle()).data;
  if(!p){await sb.auth.signOut();return authView('Could not load profile: '+(ins.error?ins.error.message:'run fix.sql in Supabase'))}}
 me=p;tab='overview';await loadAll();shell()}
async function loadAll(){
 const r=me.role,q=[],E=(x,k)=>{if(x.error)toast(x.error.message);D[k]=x.data||[]};
 q.push(sb.rpc('overview_stats').then(x=>E(x,'stats')));
 if(['executive','secretariat','needs_assessment'].includes(r))q.push(sb.from('needs').select('*').order('created_at',{ascending:false}).then(x=>E(x,'needs')));
 if(['executive','secretariat','team_member'].includes(r))q.push(sb.rpc('team_roster').then(x=>E(x,'roster')));
 if(r!=='viewer')q.push(sb.from('team_work').select('*').order('created_at',{ascending:false}).then(x=>E(x,'work')));
 if(isAdmin())q.push(sb.from('profiles').select('*').order('created_at').then(x=>E(x,'users')));
 await Promise.all(q)}
async function refresh(){await loadAll();render()}

/* ---------- SHELL ---------- */
function shell(){const T=TABS[me.role]||TABS.viewer;
 $('#root').innerHTML=`<div class="app"><aside><h2>TECH-CARE<br>OUTREACH TOOL</h2><nav>${T.map(t=>`<a id="n_${t}" onclick="go('${t}')">${IC[t]} ${TL[t]}</a>`).join('')}</nav>
 <div class="me"><b>${esc(me.full_name)}</b><br><small>${ROLES[me.role]}${me.team?' · '+esc(me.team):''}</small><br><br><button class="s" style="color:#fff;border-color:#fff" onclick="sb.auth.signOut()">Sign out</button></div></aside><main id="main"></main></div>`;render()}
function go(t){tab=t;render()}
function render(){document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.id==='n_'+tab));
 charts.forEach(c=>c.destroy());charts=[];
 $('#main').innerHTML=`<h1>${TL[tab]}</h1>`+V[tab]();if(tab==='overview')drawCharts()}
const V={overview,needs:needsV,facilities:facV,users:usersV,team:teamV,settings:setV};

/* ---------- OVERVIEW ---------- */
const ovStats=()=>me.role==='team_member'&&me.facility?D.stats.filter(s=>s.facility===me.facility):D.stats;
function overview(){const s=ovStats(),sum=k=>s.reduce((a,x)=>a+Number(x[k]),0);
 return `<div class="kpis">${[['assessed','Equipment assessed'],['pm_done','Preventive maintenance done'],['cm_done','Corrective maintenance done'],['tr_done','User trainings organised']].map(([k,l])=>`<div class="card kpi"><b>${sum(k)}</b>${l}</div>`).join('')}</div>
 <div class="grid">${['c1','c2','c3','c4'].map(i=>`<div class="card"><div class="cc"><canvas id="${i}"></canvas></div></div>`).join('')}</div>`}
function drawCharts(){const s=ovStats(),tx=getComputedStyle(document.documentElement).getPropertyValue('--tx').trim();
 [['c1','assessed','Equipment assessed','#0ea5e9'],['c2','tr_done','User trainings organised','#6366f1'],['c3','pm_done','Preventive maintenance done','#14b8a6'],['c4','cm_done','Corrective maintenance done','#f59e0b']].forEach(([id,k,l,c])=>{
 charts.push(new Chart($('#'+id),{type:'bar',data:{labels:s.map(x=>x.facility.replace(' Hospital','')),datasets:[{data:s.map(x=>Number(x[k])),backgroundColor:c,borderRadius:6}]},
 options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},title:{display:true,text:l,color:tx}},scales:{x:{ticks:{color:tx}},y:{beginAtZero:true,ticks:{precision:0,color:tx}}}}}))})}

/* ---------- EXPORT / IMPORT / QR HELPERS ---------- */
const NC=[['Facility','facility'],['Equipment','equipment'],['Location','location'],['Manufacturer','manufacturer'],['Serial No.','serial'],['Model','model'],['Service Required','service'],['Functional Status','func_status'],['Spare Parts / Accessories','spare'],['Quantity','qty'],['Est. Cost (GHS)','est_cost'],['Total Cost (GHS)','total_cost'],['Remarks','remarks'],['Assessor','assessor']];
const WC=[['Facility','facility'],['Team','team'],['Equipment','equipment'],['Location','location'],['Serial No.','serial'],['Model','model'],['Service Done','service'],['Equipment Trained On','equip_trained'],['Users Trained','users_trained'],['Remarks','remarks']];
const TC=WC.filter(c=>c[1]!=='team');
const bdg=s=>s?`<span class="pill ${/Corrective/.test(s)?'cm':/Preventive/.test(s)?'pm':'tr'}">${esc(s)}</span>`:'';
function dl(b,n){const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000)}
const stamp=()=>new Date().toISOString().slice(0,10);
const mapRows=(rows,C)=>rows.map(r=>Object.fromEntries(C.map(([l,k])=>[l,r[k]==null?'':r[k]])));
function rowsFor(id){
 if(id==='needs')return mapRows(D.needs,NC);
 if(id==='team')return mapRows(D.work,WC);
 if(id==='users')return D.users.map(u=>({Name:u.full_name,Email:u.email,Phone:u.phone,Role:ROLES[u.role],Team:u.team||'',Facility:u.facility||''}));
 return FAC.map(facSum).map(s=>({Facility:s.f,'Equipment assessed':s.assessed,'PM needed':s.pmN,'CM needed':s.cmN,'Trainings needed':s.trN,'PM done':s.pmD,'CM done':s.cmD,'Trainings done':s.trD}))}
const expBtn=id=>isAdmin()?`<select class="btn" onchange="doExp(this,'${id}')"><option value="">⬇ Export…</option><option value="xlsx">Excel (.xlsx)</option><option value="pdf">PDF</option><option value="csv">CSV</option></select>`:'';
async function loadImg(url){try{const r=await fetch(url);if(!r.ok)return null;const b=await r.blob();
 const src=await new Promise((ok,no)=>{const fr=new FileReader();fr.onload=()=>ok(fr.result);fr.onerror=no;fr.readAsDataURL(b)});
 const im=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=src});
 const s=Math.min(1,160/im.naturalWidth,160/im.naturalHeight),w=Math.max(1,Math.round(im.naturalWidth*s)),h=Math.max(1,Math.round(im.naturalHeight*s)),c=document.createElement('canvas');c.width=w;c.height=h;
 const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);const dataUrl=c.toDataURL('image/jpeg',0.85);
 return{dataUrl,b64:dataUrl.split(',')[1],w,h}}catch(e){return null}}
async function doExp(sel,id){const f=sel.value;sel.selectedIndex=0;if(!f)return;let rows=rowsFor(id);if(!rows.length)return toast('Nothing to export');
 const t={needs:'Needs Assessment',team:'Team Members Work',users:'Users',facilities:'Facilities Summary'}[id],fn='techcare_'+id+'_'+stamp(),isN=id==='needs';let imgs=[];
 try{if(isN){const urls=D.needs.map(r=>r.picture_url||'');
   if(f==='csv')rows=rows.map((r,i)=>({...r,'Picture URL':urls[i]}));
   else{toast('Preparing export with pictures…');const cache={};await Promise.all([...new Set(urls.filter(Boolean))].map(async u=>{cache[u]=await loadImg(u)}));
    imgs=urls.map(u=>u?cache[u]:null);rows=rows.map((r,i)=>({...r,Picture:(imgs[i]||!urls[i])?'':urls[i]}))}}
 const k=Object.keys(rows[0]),pc=k.indexOf('Picture');
 if(f==='csv')return csv('techcare_'+id,rows);
 if(f==='xlsx'){const wb=new ExcelJS.Workbook(),ws=wb.addWorksheet(t);ws.addRow(k);rows.forEach(r=>ws.addRow(k.map(c=>r[c])));
  ws.getRow(1).eachCell(c=>{c.font={bold:true,color:{argb:'FFFFFFFF'}};c.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF0EA5E9'}}});
  k.forEach((c,i)=>{ws.getColumn(i+1).width=Math.min(40,Math.max(13,c.length+4))});ws.views=[{state:'frozen',ySplit:1}];
  if(isN){ws.getColumn(pc+1).width=24;imgs.forEach((im,i)=>{if(!im)return;const s=Math.min(1,150/im.w,80/im.h),w=Math.round(im.w*s),h=Math.round(im.h*s);
   ws.addImage(wb.addImage({base64:im.b64,extension:'jpeg'}),{tl:{col:pc+0.08,row:i+1+0.08},ext:{width:w,height:h},editAs:'oneCell'});ws.getRow(i+2).height=h*0.75+6})}
  return dl(new Blob([await wb.xlsx.writeBuffer()],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),fn+'.xlsx')}
 const d=new jspdf.jsPDF('l','pt','a4');d.setFontSize(14);d.text('TECH-CARE OUTREACH TOOL - '+t,40,36);d.setFontSize(8);d.text('Generated '+new Date().toLocaleString(),40,50);
 const o={head:[k],body:rows.map(r=>k.map(c=>String(r[c]))),startY:60,styles:{fontSize:7,cellPadding:3},headStyles:{fillColor:[14,165,233]}};
 if(isN){o.columnStyles={[pc]:{cellWidth:66}};o.didParseCell=h=>{if(h.section==='body'&&h.column.index===pc&&imgs[h.row.index])h.cell.styles.minCellHeight=54};
  o.didDrawCell=h=>{if(h.section==='body'&&h.column.index===pc){const im=imgs[h.row.index];if(im){const s=Math.min((h.cell.width-4)/im.w,(h.cell.height-4)/im.h);h.doc.addImage(im.dataUrl,'JPEG',h.cell.x+2,h.cell.y+2,im.w*s,im.h*s)}}}}

 if(!row.facility)return toast('Select a facility');
 const r=id?await sb.from('team_work').update(row).eq('id',id):await sb.from('team_work').insert(row);
 if(r.error)return toast(r.error.message);closeModal();toast('Data is saved');refresh()}

/* ---------- FACILITIES ---------- */
const showDone=()=>me.role!=='needs_assessment'||me.can_view_teams;
function facSum(f){const n=D.needs.filter(x=>x.facility===f),w=D.work.filter(x=>x.facility===f),c=(a,k,v)=>a.filter(x=>x[k]===v).length;
 return{f,n,w,assessed:n.filter(x=>x.service!=='User Training').length,pmN:c(n,'service','Preventive Maintenance'),cmN:c(n,'service','Corrective Maintenance'),trN:c(n,'service','User Training'),
  pmD:c(w,'service','Preventive Maintenance Done'),cmD:c(w,'service','Corrective Maintenance Done'),trD:c(w,'service','User Trainings Done'),users:w.reduce((a,x)=>a+(x.users_trained||0),0)}}
function facV(){const d=showDone();
 return (isAdmin()?`<div class="row">${expBtn('facilities')}</div>`:'')+
 FAC.map(facSum).map(s=>`<div class="card tw"><h3 style="margin-top:0">${esc(s.f)}</h3><table><thead><tr><th>Equipment assessed</th><th>Preventive maint. needed</th><th>Corrective maint. needed</th><th>User trainings needed</th>${d?'<th>Preventive maint. done</th><th>Corrective maint. done</th><th>User trainings done</th>':''}</tr></thead><tbody>
 <tr class="sum" onclick="this.nextElementSibling.classList.toggle('hide')" title="Click for details"><td>${s.assessed}</td><td>${s.pmN}</td><td>${s.cmN}</td><td>${s.trN}</td>${d?`<td>${s.pmD}</td><td>${s.cmD}</td><td>${s.trD}</td>`:''}</tr>
 <tr class="hide"><td colspan="7"><b>Needs assessment details</b>${s.n.length?`<table><tr><th>Equipment</th><th>Location</th><th>Serial</th><th>Service</th><th>Spare parts</th><th>Qty</th><th>Total (GHS)</th><th>Remarks</th><th>Assessor</th></tr>${s.n.map(r=>`<tr><td>${esc(r.equipment)}</td><td>${esc(r.location)}</td><td>${esc(r.serial)}</td><td>${esc(r.service)}</td><td>${esc(r.spare)}</td><td>${r.qty==null?'':r.qty}</td><td>${r.service==='User Training'?'':money(r.total_cost)}</td><td>${esc(r.remarks)}</td><td>${esc(r.assessor)}</td></tr>`).join('')}</table>`:'<p>None.</p>'}
 ${d?`<b>Work done</b> (users trained: ${s.users})${s.w.length?`<table><tr><th>Team</th><th>Equipment</th><th>Location</th><th>Serial</th><th>Service</th><th>Trained on</th><th>Users</th><th>Remarks</th></tr>${s.w.map(r=>`<tr><td>${esc(r.team)}</td><td>${esc(r.equipment)}</td><td>${esc(r.location)}</td><td>${esc(r.serial)}</td><td>${esc(r.service)}</td><td>${esc(r.equip_trained)}</td><td>${r.users_trained==null?'':r.users_trained}</td><td>${esc(r.remarks)}</td></tr>`).join('')}</table>`:'<p>None.</p>'}`:''}</td></tr></tbody></table></div>`).join('')}

/* ---------- USERS ---------- */
function usersV(){const ex=me.role==='executive',dis=ex?'':' disabled';
 return `<div class="row">${expBtn('users')}<small>New users register themselves on the sign-in page and appear here as Viewers.${ex?'':' Only a BME Executive can assign roles.'}</small></div>
 <div class="card tw"><table><thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Role</th><th>Team</th><th>Assigned facility</th><th>View team data</th><th></th></tr></thead><tbody>
 ${D.users.map(u=>`<tr><td>${esc(u.full_name)}</td><td>${esc(u.email)}</td><td>${esc(u.phone)}</td>
 <td><select id="r_${u.id}"${dis}>${opts(Object.keys(ROLES).map(k=>ROLES[k]),ROLES[u.role])}</select></td>
 <td><input id="t_${u.id}" value="${esc(u.team)}" placeholder="e.g. Team 1"${dis}></td>
 <td><select id="f_${u.id}"${dis}><option value="">—</option>${opts(FAC,u.facility)}</select></td>
 <td><input type="checkbox" id="v_${u.id}" style="width:auto"${u.can_view_teams?' checked':''}${dis}></td>
 <td style="white-space:nowrap">${ex?`<button onclick="saveUser('${u.id}')">Save</button> ${u.id!==me.id?`<button class="d" onclick="delUser('${u.id}')">Remove</button>`:''}`:''}</td></tr>`).join('')}</tbody></table></div>`}
async function saveUser(id){const g=k=>$('#'+k+'_'+id),role=Object.keys(ROLES).find(k=>ROLES[k]===g('r').value);
 const r=await sb.from('profiles').update({role,team:g('t').value.trim()||null,facility:g('f').value||null,can_view_teams:g('v').checked}).eq('id',id);
 if(r.error)return toast(r.error.message);toast('User updated');if(id===me.id)me=(await sb.from('profiles').select('*').eq('id',id).single()).data;refresh()}
async function delUser(id){if(!confirm('Permanently remove this user?'))return;const r=await sb.rpc('delete_user',{uid:id});if(r.error)return toast(r.error.message);toast('User removed');refresh()}

/* ---------- SETTINGS ---------- */
function setV(){return `<div class="grid"><div class="card"><h3 style="margin-top:0">My details</h3><form onsubmit="saveMe(event)">
 <label>Full name<input name="fname" required value="${esc(me.full_name)}"></label><label>Email<input name="email" type="email" required value="${esc(me.email)}"></label>
 <label>Telephone (login ID – contact an executive to change)<input value="${esc(me.phone)}" disabled></label><button>Save details</button></form></div>
 <div class="card"><h3 style="margin-top:0">Change password</h3><form onsubmit="savePw(event)"><label>New password<input name="p1" type="password" minlength="6" required></label>
 <label>Confirm new password<input name="p2" type="password" minlength="6" required></label><button>Update password</button></form></div>
 <div class="card"><h3 style="margin-top:0">Appearance</h3><button class="s" onclick="setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');render()">Toggle dark / light mode</button></div></div>`}
async function saveMe(e){e.preventDefault();const f=e.target.elements,r=await sb.from('profiles').update({full_name:f.fname.value.trim(),email:f.email.value.trim()}).eq('id',me.id);
 if(r.error)return toast(r.error.message);me.full_name=f.fname.value.trim();me.email=f.email.value.trim();toast('Details updated');shell();go('settings')}
async function savePw(e){e.preventDefault();const f=e.target.elements;if(f.p1.value!==f.p2.value)return toast('Passwords do not match');
 const r=await sb.auth.updateUser({password:f.p1.value});if(r.error)return toast(r.error.message);e.target.reset();toast('Password changed')}
init();
</script></body></html>
